name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version label to use for artifacts when running manually (e.g. carla-2026.02.17-00)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Guardrail: no legacy backend package refs
        run: |
          set -euo pipefail
          if rg -n "whisper\.cpp|whisper\.spm|CPPBindingImpl|CPPIntegration|ggerganov" \
            Carla/Sources Carla/Tests Carla/Package.swift Carla/Package.resolved \
            Carla/Carla.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "Found disallowed legacy backend references" >&2
            exit 1
          fi

      - name: Install swift-format (lint tool)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install swift-format

      - name: Lint (swift-format, strict)
        run: |
          set -euo pipefail
          swift-format lint --recursive --strict Carla/Sources Carla/Tests

      - name: Swift Package tests
        run: |
          set -euo pipefail
          cd Carla
          swift test

      - name: Xcode build (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Carla/Carla.xcodeproj \
            -scheme Carla \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Release hardening preflight (notarization script + ASR gate report)
        run: |
          set -euo pipefail
          bash -n scripts/sign-and-notarize.sh
          chmod +x scripts/validate-asr-rollout.sh
          ASR_GATE_MIN_SAMPLES=0 ASR_VALIDATION_REPORT_PATH="$RUNNER_TEMP/asr-validation-report.json" \
            scripts/validate-asr-rollout.sh

  build-dmg:
    needs: ci
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine tag
        id: vars
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          SAFE_TAG="${TAG//\//-}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Import Apple code signing assets
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_DEVELOPER_ID_PRIVATE_KEY: ${{ secrets.APPLE_DEVELOPER_ID_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_DEVELOPER_ID_CERT:-}" ]]; then
            echo "Missing secret: APPLE_DEVELOPER_ID_CERT" >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          CERT_FILE="$RUNNER_TEMP/signing-cert.p12"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > "$CERT_FILE"

          PKCS12_OUTPUT=$(openssl pkcs12 -in "$CERT_FILE" -passin pass:"${APPLE_DEVELOPER_ID_PASSWORD:-}" -noout 2>&1 || true)
          if [[ "$PKCS12_OUTPUT" == *"unsupported"* ]] || [[ "$PKCS12_OUTPUT" == *"Algorithm (RC2-40-CBC"* ]]; then
            PKCS12_OUTPUT=$(openssl pkcs12 -legacy -in "$CERT_FILE" -passin pass:"${APPLE_DEVELOPER_ID_PASSWORD:-}" -noout 2>&1 || true)
          fi

          if [[ "$PKCS12_OUTPUT" == *"Mac verify error"* ]] || [[ "$PKCS12_OUTPUT" == *"invalid password"* ]]; then
            echo "APPLE_DEVELOPER_ID_CERT appears to be a .p12, but APPLE_DEVELOPER_ID_PASSWORD is incorrect." >&2
            exit 1
          fi

          if [[ -z "$PKCS12_OUTPUT" ]] || [[ "$PKCS12_OUTPUT" == MAC:* ]]; then
            security import "$CERT_FILE" \
              -k "$KEYCHAIN_PATH" \
              -P "${APPLE_DEVELOPER_ID_PASSWORD:-}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          elif openssl x509 -inform DER -in "$CERT_FILE" -noout >/dev/null 2>&1 || openssl x509 -in "$CERT_FILE" -noout >/dev/null 2>&1; then
            security import "$CERT_FILE" \
              -k "$KEYCHAIN_PATH" \
              -T /usr/bin/codesign \
              -T /usr/bin/security

            if [[ -z "${APPLE_DEVELOPER_ID_PRIVATE_KEY:-}" ]]; then
              echo "APPLE_DEVELOPER_ID_CERT looks like a .cer certificate without private key." >&2
              echo "Provide APPLE_DEVELOPER_ID_PRIVATE_KEY (base64 of .p12/.key) or set APPLE_DEVELOPER_ID_CERT to a .p12 that contains cert+private key." >&2
              exit 1
            fi

            KEY_FILE="$RUNNER_TEMP/signing-key.bin"
            printf '%s' "$APPLE_DEVELOPER_ID_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"

            if ! security import "$KEY_FILE" -k "$KEYCHAIN_PATH" -P "${APPLE_DEVELOPER_ID_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security; then
              security import "$KEY_FILE" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
            fi
          else
            echo "APPLE_DEVELOPER_ID_CERT is neither a valid .p12 nor an X.509 certificate (.cer/.pem)." >&2
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Available identities after import:"
          security find-identity -v -p codesigning || true

      - name: Resolve signing identity
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          set -euo pipefail

          REQUESTED_IDENTITY="${APPLE_DEVELOPER_ID:-}"
          RESOLVED_IDENTITY=""

          if [[ -n "$REQUESTED_IDENTITY" ]] && security find-identity -v -p codesigning | grep -F "\"$REQUESTED_IDENTITY\"" >/dev/null; then
            RESOLVED_IDENTITY="$REQUESTED_IDENTITY"
          fi

          if [[ -z "$RESOLVED_IDENTITY" ]]; then
            RESOLVED_IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)
          fi

          if [[ -z "$RESOLVED_IDENTITY" ]]; then
            echo "No Developer ID Application identity found after certificate import." >&2
            echo "Available code signing identities:" >&2
            security find-identity -v -p codesigning || true
            echo "Expected: Developer ID Application: ..." >&2
            exit 1
          fi

          echo "Using signing identity: $RESOLVED_IDENTITY"
          echo "SIGNING_IDENTITY=$RESOLVED_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app (Release, unsigned)
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project Carla/Carla.xcodeproj \
            -scheme Carla \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release/Carla.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app not found at: $APP_PATH" >&2
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name '*.app' -print
            exit 1
          fi

          echo "DERIVED_DATA=$DERIVED_DATA" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package bundled MLX runtime assets
        run: |
          set -euo pipefail
          scripts/package-mlx-runtime-assets.sh "$APP_PATH"

      - name: Verify bundled MLX runtime assets
        run: |
          set -euo pipefail
          scripts/verify-mlx-runtime-assets.sh "$APP_PATH"

      - name: Inject Sparkle public key
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            echo "Missing secret: SPARKLE_PUBLIC_ED_KEY" >&2
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$APP_PATH/Contents/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $SPARKLE_PUBLIC_ED_KEY" "$APP_PATH/Contents/Info.plist"

      - name: Sign app bundle (Developer ID)
        run: |
          set -euo pipefail
          codesign --force --deep --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH"

      - name: Verify code signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" || true
          spctl -a -vv "$APP_PATH" || true

      - name: Create Sparkle artifacts (zip + appcast)
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SPARKLE_PRIVATE_ED_KEY:-}" ]]; then
            echo "Missing secret: SPARKLE_PRIVATE_ED_KEY" >&2
            exit 1
          fi

          SPARKLE_BIN_DIR="$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin"
          SIGN_UPDATE_BIN="$SPARKLE_BIN_DIR/sign_update"
          if [[ ! -x "$SIGN_UPDATE_BIN" ]]; then
            echo "Sparkle sign_update binary not found at: $SIGN_UPDATE_BIN" >&2
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/sparkle_ed25519_private_key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$KEY_FILE"

          ZIP_NAME="Carla-${{ steps.vars.outputs.safe_tag }}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          /usr/bin/ditto --norsrc -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          SIGN_OUTPUT=$("$SIGN_UPDATE_BIN" --ed-key-file "$KEY_FILE" -p "$ZIP_PATH" 2>&1)
          SPARKLE_SIG=$(printf '%s\n' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' | head -n1)
          if [[ -z "$SPARKLE_SIG" ]]; then
            SPARKLE_SIG=$(printf '%s\n' "$SIGN_OUTPUT" | tr ' ' '\n' | sed -n 's/^sparkle:edSignature=//p' | tr -d '"' | head -n1)
          fi
          if [[ -z "$SPARKLE_SIG" ]]; then
            echo "Could not parse Sparkle signature from sign_update output:" >&2
            printf '%s\n' "$SIGN_OUTPUT" >&2
            exit 1
          fi

          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")
          ZIP_LENGTH=$(stat -f%z "$ZIP_PATH")
          PUB_DATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")

          REPO="${{ github.repository }}"
          TAG="${{ steps.vars.outputs.tag }}"
          ZIP_URL="https://github.com/$REPO/releases/download/$TAG/$ZIP_NAME"
          APPCAST_PATH="$RUNNER_TEMP/appcast.xml"

          APP_VERSION="$APP_VERSION" APP_BUILD="$APP_BUILD" ZIP_URL="$ZIP_URL" ZIP_LENGTH="$ZIP_LENGTH" SPARKLE_SIG="$SPARKLE_SIG" PUB_DATE="$PUB_DATE" APPCAST_PATH="$APPCAST_PATH" python3 - <<'PY'
          from pathlib import Path
          import os

          appcast = f'''<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Carla Updates</title>
              <item>
                <title>Version {os.environ["APP_VERSION"]}</title>
                <pubDate>{os.environ["PUB_DATE"]}</pubDate>
                <sparkle:version>{os.environ["APP_BUILD"]}</sparkle:version>
                <sparkle:shortVersionString>{os.environ["APP_VERSION"]}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="{os.environ["ZIP_URL"]}"
                  type="application/octet-stream"
                  length="{os.environ["ZIP_LENGTH"]}"
                  sparkle:edSignature="{os.environ["SPARKLE_SIG"]}"/>
              </item>
            </channel>
          </rss>
          '''
          Path(os.environ["APPCAST_PATH"]).write_text(appcast)
          PY

          shasum -a 256 "$ZIP_PATH" | awk '{print $1}' > "$ZIP_PATH.sha256"
          shasum -a 256 "$APPCAST_PATH" | awk '{print $1}' > "$APPCAST_PATH.sha256"

          echo "SPARKLE_ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "APPCAST_PATH=$APPCAST_PATH" >> "$GITHUB_ENV"

      - name: Create DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"

          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG_NAME="${{ steps.vars.outputs.safe_tag }}.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"

          hdiutil create \
            -volname "Carla" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          cp "$DMG_PATH" "$RUNNER_TEMP/Carla-latest.dmg"

          shasum -a 256 "$DMG_PATH" | awk '{print $1}' > "$RUNNER_TEMP/$DMG_NAME.sha256"
          shasum -a 256 "$RUNNER_TEMP/Carla-latest.dmg" | awk '{print $1}' > "$RUNNER_TEMP/Carla-latest.dmg.sha256"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carla-release-${{ steps.vars.outputs.safe_tag }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
            ${{ runner.temp }}/Carla-latest.dmg
            ${{ runner.temp }}/Carla-latest.dmg.sha256
            ${{ env.SPARKLE_ZIP_PATH }}
            ${{ env.SPARKLE_ZIP_PATH }}.sha256
            ${{ env.APPCAST_PATH }}
            ${{ env.APPCAST_PATH }}.sha256

      - name: Attach release assets (DMG + Sparkle)
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
            ${{ runner.temp }}/Carla-latest.dmg
            ${{ runner.temp }}/Carla-latest.dmg.sha256
            ${{ env.SPARKLE_ZIP_PATH }}
            ${{ env.SPARKLE_ZIP_PATH }}.sha256
            ${{ env.APPCAST_PATH }}
            ${{ env.APPCAST_PATH }}.sha256
