name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version label to use for artifacts when running manually (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine tag
        id: vars
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Sanitize for filenames.
          SAFE_TAG="${TAG//\//-}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Toolchain versions
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Install swift-format (lint tool)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install swift-format

      - name: Lint (swift-format, strict)
        run: |
          set -euo pipefail
          swift-format lint --recursive --strict Carla/Sources Carla/Tests

      - name: Swift Package tests
        run: |
          set -euo pipefail
          cd Carla
          swift test

      - name: Import Apple code signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

      - name: Build app (Release, unsigned)
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project Carla/Carla.xcodeproj \
            -scheme Carla \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release/Carla.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app not found at: $APP_PATH" >&2
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name '*.app' -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Resolve signing identity
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          set -euo pipefail

          REQUESTED_IDENTITY="${APPLE_DEVELOPER_ID:-}"
          RESOLVED_IDENTITY=""

          if [[ -n "$REQUESTED_IDENTITY" ]] && security find-identity -v -p codesigning | grep -F "\"$REQUESTED_IDENTITY\"" >/dev/null; then
            RESOLVED_IDENTITY="$REQUESTED_IDENTITY"
          fi

          if [[ -z "$RESOLVED_IDENTITY" ]]; then
            RESOLVED_IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)
          fi

          if [[ -z "$RESOLVED_IDENTITY" ]]; then
            echo "No Developer ID Application identity found after certificate import." >&2
            echo "Available code signing identities:" >&2
            security find-identity -v -p codesigning || true
            exit 1
          fi

          echo "Using signing identity: $RESOLVED_IDENTITY"
          echo "SIGNING_IDENTITY=$RESOLVED_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign app bundle (Developer ID)
        run: |
          set -euo pipefail

          # Sign nested content and apply hardened runtime on the app bundle.
          codesign --force --deep --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH"

      - name: Verify code signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" || true
          spctl -a -vv "$APP_PATH" || true

      - name: Create DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"

          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG_NAME="${{ steps.vars.outputs.safe_tag }}.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"

          hdiutil create \
            -volname "Carla" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          # Convenience alias for updaters that want a stable filename.
          cp "$DMG_PATH" "$RUNNER_TEMP/Carla-latest.dmg"

          shasum -a 256 "$DMG_PATH" | awk '{print $1}' > "$RUNNER_TEMP/$DMG_NAME.sha256"
          shasum -a 256 "$RUNNER_TEMP/Carla-latest.dmg" | awk '{print $1}' > "$RUNNER_TEMP/Carla-latest.dmg.sha256"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carla-dmg-${{ steps.vars.outputs.safe_tag }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
            ${{ runner.temp }}/Carla-latest.dmg
            ${{ runner.temp }}/Carla-latest.dmg.sha256

      - name: Attach DMG to GitHub Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
            ${{ runner.temp }}/Carla-latest.dmg
            ${{ runner.temp }}/Carla-latest.dmg.sha256
