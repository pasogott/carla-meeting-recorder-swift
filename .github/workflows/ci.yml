name: ci

on:
  push:
    branches:
      - development
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Install swift-format (lint tool)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install swift-format

      - name: Lint (swift-format, strict)
        run: |
          set -euo pipefail
          swift-format lint --recursive --strict Carla/Sources Carla/Tests

      - name: Swift Package tests
        run: |
          set -euo pipefail
          cd Carla
          swift test

      - name: Xcode build (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Carla/Carla.xcodeproj \
            -scheme Carla \
            -configuration Debug \
            -destination 'platform=macOS' \
            build
